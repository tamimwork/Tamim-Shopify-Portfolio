function loginUI(){if($("#lg"))return;const d=document.createElement("div");d.id="lg";d.style.cssText="position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px";
 d.innerHTML=`<div class="fcard" style="width:100%;max-width:360px"><h3>Admin login</h3><label>Password<input type="password" id="lp" autocomplete="current-password"></label><p class="mu" id="le" style="margin:0;font-size:.85rem"></p><div class="row" style="margin:0"><button class="btn" id="lx">Cancel</button><button class="btn p" id="lo">Log in</button></div></div>`;document.body.append(d);$("#lp").focus();
 const go=async()=>{$("#le").textContent="";try{const r=await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:$("#lp").value})});if(!r.ok)throw 0;d.remove();history.replaceState(null,"",location.pathname);$("#edit").style.display="block";toast("Logged in. Tap Edit site.")}catch(e){$("#le").textContent="Wrong password"}};
 $("#lo").onclick=go;$("#lp").onkeydown=e=>{if(e.key==="Enter")go()};$("#lx").onclick=()=>{d.remove();history.replaceState(null,"",location.pathname)}}
$("#admin").addEventListener("input",e=>{const t=e.target;if(t.dataset.k)set(draft,t.dataset.k,t.hasAttribute("data-num")?(+t.value||0):t.value)});
$("#admin").addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
 if(t.id==="cancel")return open_(false);if(t.id==="save")return save();
 $$("#admin details[open]").forEach(x=>openK.add(x.dataset.key));const d=t.dataset;
 if(d.lo!==undefined){fetch("/api/logout",{method:"POST"}).then(()=>location.reload());return}
 if(d.tog!==undefined){$("#admin").classList.toggle("mo");return}
 if(d.m){adm=d.m;$("#admin").classList.remove("mo");adminUI(false);return}
 if(d.pf)pf=d.pf;
 else if(d.day!==undefined){const c=draft.site.cal,n=+d.day;c.days=c.days.includes(n)?c.days.filter(x=>x!==n):[...c.days,n]}
 else if(d.add){const k=d.add,b={...LIST[k].b};if(k==="projects"&&pf!=="all")b.cat=pf;draft[k].unshift(b);clearK(k);openK.add(k+".0")}
 else if(d.del){const[k,i]=d.del.split(",");if(!confirm("Delete this item?"))return;draft[k].splice(+i,1);clearK(k)}
 else if(d.mv){const[k,i,s]=d.mv.split(","),a=+i,j=a+ +s,L=draft[k];if(j<0||j>=L.length)return;[L[a],L[j]]=[L[j],L[a]];clearK(k)}
 else if(d.sh){const h=draft.site.hide??={};h[d.sh]=!h[d.sh]}
 else if(d.ic){const[q,n]=d.ic.split("|");set(draft,q,n)}
 else if(d.clr)set(draft,d.clr,"");
 else return;adminUI(true)});
$("#admin").addEventListener("change",async e=>{const t=e.target;if(!t.dataset.up||!t.files[0])return;
 try{const r=await uploadImg(t.files[0]);set(draft,t.dataset.up,r.id);$$("#admin details[open]").forEach(x=>openK.add(x.dataset.key));adminUI(true)}catch(x){alert("Upload failed: "+(x.message||x.code||x))}});
$("#edit").onclick=()=>{draft=structuredClone(D);adm="hero";pf="all";openK=new Set();adminUI(false);open_(true)};
(async()=>{try{const r=await fetch("/api/me");if((await r.json()).admin)$("#edit").style.display="block"}catch(e){}if(location.hash==="#admin")loginUI()})();
addEventListener("hashchange",()=>{if(location.hash==="#admin")loginUI()});
</script>


</body></html>
